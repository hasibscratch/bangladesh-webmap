<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangladesh Explorer & Spatial Portal</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #navbar {
      height: 54px;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
    }
    #navbar h3 { margin: 0; font-size: 1.05rem; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    
    #map {
      height: calc(100% - 54px);
      width: 100%;
      background: #e2e8f0;
    }
    .spot-card {
      width: 220px;
    }
    .spot-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 6px;
    }
    .spot-card h4 {
      margin: 4px 0 2px 0;
      color: #0f172a;
    }
    .spot-card p {
      font-size: 0.8rem;
      color: #475569;
      margin: 4px 0;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
    }
    #auth-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .modal-box h3 { margin-top: 0; margin-bottom: 12px; }
    .modal-box input {
      width: 100%;
      padding: 8px;
      margin: 6px 0 12px 0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div id="navbar">
    <h3>Bangladesh Explorer & Hazard Watch</h3>
    <div class="nav-actions">
      <span id="user-status" style="font-size: 0.85rem; color: #94a3b8;">Guest View</span>
      <button class="btn" id="auth-btn" onclick="openAuthModal()">Log In / Sign Up</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Auth Dialog -->
  <div id="auth-modal">
    <div class="modal-box">
      <h3 id="modal-title">Sign In</h3>
      <label style="font-size: 0.8rem; font-weight: 500;">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" />
      <label style="font-size: 0.8rem; font-weight: 500;">Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" />
      <div id="auth-error" style="color: #ef4444; font-size: 0.75rem; margin-bottom: 8px; display: none;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="handleAuth('login')">Log In</button>
        <button class="btn btn-secondary" onclick="handleAuth('signup')">Sign Up</button>
        <button class="btn btn-secondary" onclick="closeAuthModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // -------------------------------------------------------------
    // 1. SUPABASE CREDENTIALS
    // -------------------------------------------------------------
    const SUPABASE_URL = "[https://invxmeedrdrotjakbkdl.supabase.co](https://invxmeedrdrotjakbkdl.supabase.co)";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImludnhtZWVkcmRyb3RqYWtia2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMTY0MTYsImV4cCI6MjEwOTY5MjQxNn0.L2Nbql5kpMCDctU1l1GmDAFOaftKmZHQipJ_Q5Qt-uU";

    // -------------------------------------------------------------
    // 2. LEAFLET BASE MAP SETUP
    // -------------------------------------------------------------
    const map = L.map('map').setView([23.8103, 90.4125], 7);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const darkBasemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CARTO'
    });

    let currentUser = null;
    let selectedSpotId = null;

    function getMarkerOptions(isHighlighted) {
      return {
        radius: isHighlighted ? 12 : 8,
        fillColor: isHighlighted ? '#e11d48' : '#2563eb',
        color: '#ffffff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
      };
    }

    function createPopupContent(props) {
      return `
        <div class="spot-card">
          <span class="badge">${props.category || 'Tourist Spot'}</span>
          <h4>${props.name}</h4>
          <p>${props.desc || ''}</p>
          ${props.image ? `<img src="${props.image}" alt="${props.name}" />` : ''}
        </div>
      `;
    }

    // Default starter points so map works even before DB connects
    const defaultSpotsGeoJSON = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "id": 1,
            "name": "Cox's Bazar Sea Beach",
            "category": "Beach",
            "desc": "The longest natural sea beach in the world.",
            "image": "https://images.unsplash.com/photo-1608958435020-e8a7109ba809?w=400&q=80"
          },
          "geometry": { "type": "Point", "coordinates": [91.9847, 21.4272] }
        },
        {
          "type": "Feature",
          "properties": {
            "id": 2,
            "name": "Sundarbans Mangrove Forest",
            "category": "Ecological Reserve",
            "desc": "UNESCO World Heritage site and home of the Royal Bengal Tiger.",
            "image": "https://images.unsplash.com/photo-1610484826967-09c5720778c7?w=400&q=80"
          },
          "geometry": { "type": "Point", "coordinates": [89.5403, 22.2856] }
        },
        {
          "type": "Feature",
          "properties": {
            "id": 3,
            "name": "Sajek Valley",
            "category": "Hill Tracts",
            "desc": "Surrounded by floating clouds and green mountains.",
            "image": "https://images.unsplash.com/photo-1609137144813-7d9921338f24?w=400&q=80"
          },
          "geometry": { "type": "Point", "coordinates": [92.2985, 23.3820] }
        }
      ]
    };

    const touristLayer = L.geoJSON(defaultSpotsGeoJSON, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, getMarkerOptions(false)),
      onEachFeature: (feature, layer) => {
        const props = feature.properties;
        layer.bindTooltip(`<strong>${props.name}</strong><br><small>${props.category || ''}</small>`, {
          sticky: true,
          direction: 'top'
        });
        layer.bindPopup(createPopupContent(props));
        layer.on('click', () => {
          if (currentUser) {
            selectedSpotId = props.id;
            refreshStyles();
          }
        });
      }
    }).addTo(map);

    function refreshStyles() {
      touristLayer.eachLayer((layer) => {
        const isSelected = layer.feature.properties.id === selectedSpotId;
        layer.setStyle(getMarkerOptions(isSelected));
      });
    }

    // Hazard layer placeholder
    const mockHazardLayer = L.layerGroup();
    L.circle([22.1, 90.8], {
      color: '#dc2626',
      fillColor: '#ef4444',
      fillOpacity: 0.25,
      radius: 60000
    }).bindPopup("<strong>Coastal Hazard Risk Zone</strong><br>Monsoon Cyclone & Surge Warning").addTo(mockHazardLayer);

    L.control.layers(
      { "OpenStreetMap": osm, "Carto Dark": darkBasemap },
      { "Tourist Attractions": touristLayer, "Emergency / Hazard Zones (Demo)": mockHazardLayer },
      { collapsed: false }
    ).addTo(map);

    // -------------------------------------------------------------
    // 3. SAFE SUPABASE INITIALIZATION (Variable renamed to sbClient)
    // -------------------------------------------------------------
    let sbClient = null;

    if (SUPABASE_URL.startsWith("http") && !SUPABASE_URL.includes("PASTE_YOUR")) {
      try {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        loadLivePostGISData();
        setupAuthListeners();
      } catch (err) {
        console.warn("Supabase init error:", err);
      }
    }

    async function loadLivePostGISData() {
      if (!sbClient) return;
      try {
        const { data, error } = await sbClient.rpc('get_tourist_spots_geojson');
        if (!error && data && data.features && data.features.length > 0) {
          touristLayer.clearLayers();
          touristLayer.addData(data);
          map.fitBounds(touristLayer.getBounds(), { padding: [30, 30] });
        }
      } catch (e) {
        console.warn("Could not load PostGIS RPC:", e);
      }
    }

    // -------------------------------------------------------------
    // 4. AUTHENTICATION & MODAL CONTROLS
    // -------------------------------------------------------------
    const modal = document.getElementById('auth-modal');
    const authBtn = document.getElementById('auth-btn');
    const userStatus = document.getElementById('user-status');
    const authError = document.getElementById('auth-error');

    function openAuthModal() {
      if (currentUser && sbClient) {
        sbClient.auth.signOut();
      } else {
        authError.style.display = 'none';
        modal.style.display = 'flex';
      }
    }

    function closeAuthModal() {
      modal.style.display = 'none';
    }

    async function handleAuth(type) {
      if (!sbClient) {
        const email = document.getElementById('auth-email').value.trim() || 'demo@tourist.com';
        currentUser = { email: email };
        userStatus.textContent = `Logged in: ${email.split('@')[0]} (Click marker to highlight)`;
        userStatus.style.color = '#38bdf8';
        authBtn.textContent = 'Log Out';
        authBtn.classList.add('btn-secondary');
        closeAuthModal();
        return;
      }

      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;

      if (!email || !password) {
        authError.textContent = "Please enter both email and password.";
        authError.style.display = 'block';
        return;
      }

      const res = (type === 'signup')
        ? await sbClient.auth.signUp({ email, password })
        : await sbClient.auth.signInWithPassword({ email, password });

      if (res.error) {
        authError.textContent = res.error.message;
        authError.style.display = 'block';
      } else {
        closeAuthModal();
      }
    }

    function setupAuthListeners() {
      if (!sbClient) return;
      sbClient.auth.onAuthStateChange((event, session) => {
        currentUser = session ? session.user : null;
        if (currentUser) {
          authBtn.textContent = 'Log Out';
          authBtn.classList.add('btn-secondary');
          userStatus.textContent = `Logged in: ${currentUser.email.split('@')[0]} (Click to highlight)`;
          userStatus.style.color = '#38bdf8';
        } else {
          authBtn.textContent = 'Log In / Sign Up';
          authBtn.classList.remove('btn-secondary');
          userStatus.textContent = 'Guest View (Hover for info)';
          userStatus.style.color = '#94a3b8';
          selectedSpotId = null;
          refreshStyles();
        }
      });
    }
  </script>
</body>
</html>
